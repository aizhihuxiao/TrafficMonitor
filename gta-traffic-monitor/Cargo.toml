[package]
name = "gta-traffic-monitor"
version = "1.0.0"
edition = "2021"
authors = ["GTA-TrafficMonitor Contributors"]
description = "A system monitoring tool that displays network traffic, CPU usage, memory usage and other information - Rust port of TrafficMonitor"
license = "GPL-3.0"
readme = "README.md"

[dependencies]
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
